  CAPITAL_SOLVENCY: Capital / Solvency
  PROFITABILITY_FINANCIAL_CONDITION: Profitability / Financial Condition
  MARKET_RATE_FX_RISK: Market / Rate / FX Risk
  OPERATIONAL_RISK: Operational Risk
  CYBER_RISK: Cyber Risk
  FRAUD_FINANCIAL_CRIME: Fraud / Financial Crime
  AML_CFT_SANCTIONS: AML / CFT / Sanctions
  GOVERNANCE_CONDUCT: Governance / Conduct
  REGULATORY_PRUDENTIAL_ACTION: Regulatory / Prudential Action
  PAYMENTS_DIGITAL_FINANCE: Payments / Digital Finance
  OWNERSHIP_MA_RESTRUCTURING: Ownership / M&A / Restructuring
  MACRO_FINANCIAL_SYSTEMIC: Macro-Financial / Systemic
