institution_type_display_names:
  LICENSED_COMMERCIAL_BANK: Licensed Commercial Bank
  LICENSED_SPECIALISED_BANK: Licensed Specialised Bank
  LICENSED_FINANCE_COMPANY: Licensed Finance Company
  SPECIALISED_LEASING_COMPANY: Specialised Leasing Company
  REGULATOR: Regulator
  REGULATOR_UNIT: Regulatory Unit
  MARKET_INFRASTRUCTURE: Market Infrastructure
  PAYMENT_INFRASTRUCTURE: Payment Infrastructure
supervisory_lens:
  CREDIT_RISK: Potential implications for lending standards, borrower quality, concentration, or credit losses.
  ASSET_QUALITY_NPL_STAGE3: Potential implications for impaired assets, provisioning, Stage 3 exposures, or asset quality.
  LIQUIDITY_FUNDING: Potential implications for funding profile, deposit stability, refinancing, or liquidity position.
  CAPITAL_SOLVENCY: Potential implications for regulatory capital, solvency, or loss-absorbing capacity.
  PROFITABILITY_FINANCIAL_CONDITION: Potential implications for earnings capacity and overall financial condition.
  MARKET_RATE_FX_RISK: Potential implications from interest-rate, bond-market, or foreign-exchange movements.
  OPERATIONAL_RISK: Potential implications for operational resilience, controls, continuity, or service disruption.
  CYBER_RISK: Potential implications for cyber resilience, information security, or technology-related loss.
  FRAUD_FINANCIAL_CRIME: Potential implications for fraud exposure, financial-crime controls, or operational losses.
  AML_CFT_SANCTIONS: Potential implications for AML/CFT compliance, sanctions, KYC, or transaction monitoring.
  GOVERNANCE_CONDUCT: Potential implications for governance, board oversight, senior management, or conduct.
  REGULATORY_PRUDENTIAL_ACTION: Potential implications from supervisory, prudential, or regulatory action.
  PAYMENTS_DIGITAL_FINANCE: Potential implications for payment systems, digital banking, fintech, or digital-service risk.
  OWNERSHIP_MA_RESTRUCTURING: Potential implications from ownership changes, mergers, acquisitions, or restructuring.
  MACRO_FINANCIAL_SYSTEMIC: Potential implications for the financial system from macroeconomic or systemic developments.
  OTHER_SUPERVISORY: Retained for monitoring because no more specific supervisory topic was supported.
importance:
  topic_weights:
    FRAUD_FINANCIAL_CRIME: 50
