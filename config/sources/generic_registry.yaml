version: generic-source-v1
sources:
  newsfirst:
    name: NewsFirst
    article_body_selector: .new_details
    section_name: Multi-section
    listing_url: https://english.newsfirst.lk/business
    enabled: true
    status: ACTIVE
    listing_prefer_browser: false
    article_prefer_browser: false
    article_url_patterns:
    - ^https://english\.newsfirst\.lk/20\d{2}/\d{2}/\d{2}/.+
    exclude_url_patterns:
    - /business/?$
    - /corporate-brief
    minimum_article_words: 80
    date_regexes:
    - (\d{2}-\d{2}-20\d{2}\s*\|\s*\d{1,2}:\d{2}\s*[AP]M)
    browser_retry_on_invalid: true
    production_approved: true
    listing_urls:
    - name: LatestPaginated
      url: https://english.newsfirst.lk/latest
      listing_prefer_browser: true
      # Upper bound only: paging normally stops at two pages of older dated URLs.
      pagination_click_pages: 30
      # These featured panels repeat unchanged on every archive page.
      # Keep their articles, but date-boundary checks use the scrolling list.
      pagination_date_exclude_selectors: ['.local_news', '.border-right-local']
    - name: Local
      url: https://english.newsfirst.lk/local
      listing_prefer_browser: false
    - name: World
      url: https://english.newsfirst.lk/world
      listing_prefer_browser: false
    - name: Business
      url: https://english.newsfirst.lk/business
      listing_prefer_browser: false
    - name: Homepage
      url: https://english.newsfirst.lk/
      listing_prefer_browser: false
  the_morning:
    name: The Morning
    section_name: Business
    listing_url: https://www.themorning.lk/categories/business
    enabled: true
    status: ACTIVE
    listing_prefer_browser: true
    article_prefer_browser: false
    article_url_patterns:
    - ^https://www\.themorning\.lk/articles/[A-Za-z0-9]+
    exclude_url_patterns:
    - /categories/
    - /archives
    minimum_article_words: 80
    date_regexes:
    - (\d{1,2}\s+[A-Za-z]{3}\s+20\d{2})
    browser_retry_on_invalid: true
    production_approved: true
    listing_urls:
    - name: Business
      url: https://www.themorning.lk/categories/business
      listing_prefer_browser: true
    - name: Homepage
      url: https://www.themorning.lk/
      listing_prefer_browser: true
  daily_news:
    name: Daily News
    section_name: Multi-section
    listing_url: https://dailynews.lk/category/business/
    enabled: true
    status: ACTIVE
    listing_prefer_browser: true
    article_prefer_browser: true
    article_url_patterns:
    - ^https://(?:www\.)?dailynews\.lk/20\d{2}/\d{2}/\d{2}/.+
    exclude_url_patterns:
    - /category/
    - /author/
    - /tag/
    minimum_article_words: 80
    date_regexes:
    - ([A-Za-z]{3,9}\s+\d{1,2},\s+20\d{2}(?:\s+\d{1,2}:\d{2}\s*[AP]M)?)
    browser_retry_on_invalid: true
    production_approved: true
    listing_urls:
    - name: Business
      url: https://dailynews.lk/category/business/
      listing_prefer_browser: true
    - name: Local
      url: https://dailynews.lk/category/local/
      listing_prefer_browser: true
    - name: Homepage
      url: https://dailynews.lk/
      listing_prefer_browser: true
  economynext:
    name: EconomyNext
    section_name: All posts
    listing_url: https://economynext.com/wp-json/wp/v2/posts
    enabled: true
    status: ACTIVE
    production_approved: true
    # Articles come from the publisher's WordPress API record (title, exact
    # GMT time, full content); the site's HTML carries a widget that page
    # scraping mistakes for the article body.
    minimum_article_words: 60
    exclude_url_patterns:
    - /category/
    - /tag/
    - /author/
    listing_urls:
    - name: WordPressAPI
      url: https://economynext.com/wp-json/wp/v2/posts
      type: wordpress_api
  economynews:
    name: EconomyNews
    section_name: All posts
    listing_url: https://economynews.lk/wp-json/wp/v2/posts
    enabled: true
    status: ACTIVE
    production_approved: true
    minimum_article_words: 60
    exclude_url_patterns:
    - /category/
    - /tag/
    - /author/
    listing_urls:
    - name: WordPressAPI
      url: https://economynews.lk/wp-json/wp/v2/posts
      type: wordpress_api
